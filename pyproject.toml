[project]
name = "apisacoustic"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12, <3.13"

dependencies = [
    "albumentations>=2.0.8",
    "ipywidgets>=8.1.8",
    "joblib>=1.5.3",
    "librosa>=0.11.0",
    "matplotlib>=3.10.9",
    "noisereduce>=3.0.3",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "soundfile>=0.13.1",
    "tabulate>=0.10.0",
    "timm>=1.0.27",
    "torch>=2.12.0",
    "torchaudio>=2.11.0",
    "torchcodec>=0.14.0",
    "torchvision>=0.27.0",
    "tqdm>=4.67.3",
    "transformers>=5.10.2",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org./whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'win32'" },
]
torchaudio = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
