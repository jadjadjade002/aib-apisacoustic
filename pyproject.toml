[project]
name = "apisacoustic"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12, <3.13"

dependencies = [
    "datasets>=4.8.5",
    "ipykernel",
    "jupyter>=1.1.1",
    "librosa>=0.11.0",
    "numpy>=2.2.0",
    "openai>=1.0.0",
    "pandas>=2.0.0",
    "plotly>=5.0.0",
    "seaborn>=0.13.2",
    "torch",
    "torchaudio",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org./whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'win32'" },
]
torchaudio = { index = "pytorch-cu126" }
